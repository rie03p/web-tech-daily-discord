name: Send daily web-tech digest

on:
  schedule:
    # Every Monday at 08:00 JST (23:00 UTC on Sunday). GitHub ActionsのcronはUTCです。
    - cron: '0 23 * * 0'
  workflow_dispatch:
    inputs:
      date:
        description: '対象日（JST、YYYY-MM-DD）。空欄なら当日'
        required: false
      include_previously_sent:
        description: '送信済みの記事も含める'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Send digest
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          INCLUDE_PREVIOUSLY_SENT: ${{ inputs.include_previously_sent }}
        run: python -m app.main --days 7 ${{ inputs.date && format('--date={0}', inputs.date) || '' }}
      - name: Persist sent URLs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/state.json
          git diff --cached --quiet || git commit -m "chore: record sent digest URLs"
          git push
